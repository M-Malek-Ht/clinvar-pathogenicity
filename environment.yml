name: clinvar
channels:
  - conda-forge
dependencies:
  # Minor versions used for the reported results (any platform). The exact Windows build of
  # every package is in environment-lock.yml.
  - python=3.11
  - numpy=2.4
  - pandas=3.1
  - pyarrow=26.0
  - scikit-learn=1.9
  - joblib=1.6
  - matplotlib=3.11
  - requests=2.34
  - tqdm=4.70
  - psutil=7.2
  - ipykernel=7.4
  - notebook=7.6
  - pip
# PyTorch is installed separately with pip (CUDA 12.8+ build, required for RTX 50-series):
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
